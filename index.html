    --text:#1B2033; --muted:#6B6F80;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif;}
  table{border-collapse:collapse;width:100%;}
  th,td{padding:10px 12px;text-align:right;font-size:13px;white-space:nowrap;}
  tbody tr:hover{background:#FAF8F2;}
  a{color:inherit;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;color:var(--text);background:#fff;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  input:disabled{background:#F3F1EA;color:var(--muted);}
  button{cursor:pointer;border-radius:8px;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-gold{background:var(--gold);color:var(--navyDeep);border-color:var(--gold);}
  .btn-outline{background:#fff;color:var(--navy);border-color:var(--line);}
  .btn-danger{background:var(--bad);color:#fff;border-color:var(--bad);}
  .btn-ghost{background:transparent;color:var(--muted);border-color:transparent;padding:6px 8px;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  button:hover{opacity:.88;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}

  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:#D8DDEB;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;width:100%;text-align:right;}
  .navitem:hover{background:rgba(255,255,255,.08);}
  .navitem.active{background:var(--gold);color:var(--navyDeep);}
  .sidebar .status{position:absolute;bottom:16px;right:16px;left:16px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;font-size:12px;color:#AEB4C7;}

  @media(min-width:1000px){.grid-stats{grid-template-columns:repeat(5,1fr);}}

  @media(min-width:850px){.grid-2{grid-template-columns:1fr 1fr;}}
  .grid-3{grid-template-columns:1fr;}
  @media(min-width:850px){.grid-3{grid-template-columns:1fr 1fr 1fr;}}

  .actions-cell{display:flex;gap:4px;}
  .icon-btn{background:transparent;border:none;padding:5px;border-radius:8px;}
  .icon-btn:hover{background:#F1EFE8;}

  .modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}

  .field{margin-bottom:12px;}

  .toast.ok{background:var(--okBg);color:var(--ok);border:1px solid var(--ok);}

function uid(p){ return p + "-" + Date.now().toString(36) + Math.floor(Math.random()*999); }
function esc(v){ if(v===undefined||v===null) return ""; return String(v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtMoney(n){ return (Number(n||0)).toLocaleString("ar-EG") + " ج.م"; }
function fmtPct(n){ return Math.round(n) + "%"; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isValidEgyptPhone(phone){ return /^01[0125][0-9]{8}$/.test(String(phone||"").trim()); }
function paymentStatusOf(fee, paid){ if(paid<=0) return "لم يدفع"; if(paid>=fee) return "مكتمل الدفع"; return "دفع جزئي"; }

  };
  return map[status] || ["#6B6F80","#EEE"];
}
function badge(text){ var c = statusColors(text); return '<span class="badge" style="color:'+c[0]+';background:'+c[1]+';">'+esc(text)+'</span>'; }
function downloadCSV(filename, headers, rows){
  function escC(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
  var csv = [headers.map(escC).join(",")].concat(rows.map(function(r){ return r.map(escC).join(","); })).join("\r\n");
  var blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function makeSessions(startISO, count){
  var n = Number(count) > 0 ? Number(count) : SESSIONS_COUNT;
  var start = new Date(startISO);
  var out = [];
  for(var i=0;i<n;i++){
    var d = new Date(start); d.setDate(start.getDate()+i*7);
    out.push({index:i+1, date:d.toISOString().slice(0,10), title:"السيشن "+(i+1), notes:""});
  }
  return out;
}

async function doLogin(){
  var email = (AUTH_DRAFT.email||"").trim();
  var password = AUTH_DRAFT.password||"";
  if(!email || !password){ AUTH_ERROR = "من فضلك أدخل الإيميل وكلمة المرور"; render(); return; }
  AUTH_BUSY = true; AUTH_ERROR = ""; render();
  try{
    var res = await sb.auth.signInWithPassword({email:email, password:password});

function toCamel(row){
  if(!row) return row;
  var o = {};
  Object.keys(row).forEach(function(k){
    var ck = k.replace(/_([a-z])/g, function(_,c){ return c.toUpperCase(); });
    o[ck] = row[k];
  });
  return o;
}
function toSnake(obj){
  var o = {};
  Object.keys(obj).forEach(function(k){
    var sk = k.replace(/[A-Z]/g, function(c){ return "_"+c.toLowerCase(); });
    o[sk] = obj[k];
  });
  return o;
}

function courseById(id){ return DATA.courses.filter(function(c){return c.id===id;})[0]; }
function groupById(id){ return DATA.groups.filter(function(g){return g.id===id;})[0]; }
function attendanceOf(studentId){ return DATA.attendance.filter(function(a){return a.studentId===studentId;}); }
function sessionsCountForStudent(studentId){
  var s = DATA.students.filter(function(x){return x.id===studentId;})[0];
  var g = s ? groupById(s.groupId) : null;
  return (g && g.sessions && g.sessions.length) ? g.sessions.length : SESSIONS_COUNT;
}
function attendancePct(studentId){
  var recs = attendanceOf(studentId);
  var present = recs.filter(function(r){return r.status==="حاضر";}).length;
  var total = sessionsCountForStudent(studentId);
  return total ? (present/total)*100 : 0;
}
function paymentsOf(studentId){
  return DATA.payments.filter(function(p){return p.studentId===studentId;}).sort(function(a,b){return a.date<b.date?1:-1;});
}
function nextStudentCode(){
  var nums = DATA.students.map(function(s){ return parseInt((s.code||"").split("-")[1]||"0",10); });
  var next = (nums.length? Math.max.apply(null,nums):0)+1;
  return "NVA-"+String(next).padStart(4,"0");
}

async function addPaymentFromDraft(){
  var f = UI.draft;
  var student = DATA.students.filter(function(s){return s.id===f.studentId;})[0];
  if(!student) return toast("اختر الطالب أولًا","err");
  var amount = Number(f.amount);
  if(!amount || amount<=0) return toast("قيمة الدفعة يجب أن تكون أكبر من صفر","err");
  var remaining = student.courseFee - student.totalPaid;
  var applied = Math.min(amount, remaining);
  if(amount>remaining) toast("تم تسجيل "+fmtMoney(applied)+" فقط لأن هذا هو المتبقي على الطالب","err");
  var paymentNo = "PAY-"+String(DATA.payments.length+1).padStart(4,"0");

    var draft = {id:uid("pay"), paymentNo:paymentNo, studentId:f.studentId, date:f.date||todayISO(), amount:applied, method:f.method||"نقدي", notes:f.notes||""};
    var saved = await dbInsert("payments", draft);
    await dbUpdate("students", f.studentId, {totalPaid: student.totalPaid + applied});

  if(!getPerms().canEditAttendance) return;
  var students = DATA.students.filter(function(s){return s.groupId===groupId;});
  if(!students.length) return;
  BUSY = true; render();
  try{
    var rows = students.map(function(s){
      var exists = DATA.attendance.filter(function(a){return a.studentId===s.id && a.groupId===groupId && a.sessionIndex===sessionIndex;})[0];
      return {id: exists?exists.id:uid("att"), studentId:s.id, groupId:groupId, sessionIndex:sessionIndex, status:status, notes:""};
    });
    var res = await sb.from("attendance").upsert(rows.map(toSnake), {onConflict:"student_id,group_id,session_index"}).select();

    var saved = res.data.map(toCamel);
    saved.forEach(function(row){
      var idx = DATA.attendance.findIndex(function(a){return a.studentId===row.studentId && a.groupId===row.groupId && a.sessionIndex===row.sessionIndex;});

    var parsed;
    try{ parsed = JSON.parse(reader.result); }

    });

  };
  reader.readAsText(file);

    DATA.students=[]; DATA.attendance=[]; DATA.payments=[]; DATA.settings.isDemo=false;
    toast("تم حذف كل الطلاب والحضور والمدفوعات من قاعدة البيانات لكل المستخدمين");
  }catch(e){ toast("فشلت العملية: "+dbErrText(e), "err"); }
  BUSY = false; render();
}

/* ============================== لوحة التحكم ============================== */
function statCard(icon, label, value, color){
  return '<div class="stat-card"><div class="top"><span class="label">'+esc(label)+'</span><span class="icon" style="background:'+(color?color+'22':'#F1E6C8')+'">'+icon+'</span></div><div class="value" style="'+(color?('color:'+color):'')+'">'+value+'</div></div>';
}
function pieBlock(data){
  if(!data.length) return '<div class="empty">لا توجد بيانات كافية</div>';
  var total = data.reduce(function(a,d){return a+d.value;},0) || 1;
  var cum = 0;
  var stops = data.map(function(d,i){
    var start = (cum/total)*360; cum += d.value; var end=(cum/total)*360;
    return PIE_COLORS[i%PIE_COLORS.length]+' '+start+'deg '+end+'deg';
  }).join(", ");
  var h = '<div class="pie-wrap"><div class="pie" style="background:conic-gradient('+stops+')"></div><div>';
  data.forEach(function(d,i){
    h += '<div style="display:flex;align-items:center;font-size:12px;margin-bottom:6px;"><span class="legend-dot" style="background:'+PIE_COLORS[i%PIE_COLORS.length]+'"></span>'+esc(d.name)+' <span style="color:var(--muted);margin-right:4px;">('+d.value+')</span></div>';
  });
  h += '</div></div>';
  return h;
}
function barsBlock(data, series, valueFormatter){
  var vf = valueFormatter || function(v){return v;};
  var allVals = [];
  data.forEach(function(d){ series.forEach(function(s){ allVals.push(Number(d[s.key])||0); }); });
  var max = Math.max.apply(null, allVals.concat([1])) * 1.25;
  var barAreaHeight = 170;
  var h = '<div>';
  if(series.length>1){
    h += '<div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;">';
    series.forEach(function(s){ h += '<span style="font-size:12px;color:var(--muted);display:flex;align-items:center;"><span class="legend-dot" style="background:'+s.color+'"></span>'+esc(s.label)+'</span>'; });
    h += '</div>';
  }
  h += '<div class="bars-wrap">';
  data.forEach(function(d){
    h += '<div class="bar-group"><div class="bar-cols" style="height:'+barAreaHeight+'px;">';
    series.forEach(function(s){
      var v = Number(d[s.key])||0;
      var bh = Math.max(3, (v/max)*barAreaHeight);
      h += '<div class="bar-col" style="height:'+barAreaHeight+'px;"><span class="v">'+esc(vf(v))+'</span><div class="b" style="height:'+bh+'px;background:'+s.color+';"></div></div>';
    });
    h += '</div><span style="font-size:12px;color:var(--muted);margin-top:6px;">'+esc(d.name)+'</span></div>';
  });
  h += '</div></div>';
  return h;
}
function chartCard(title, inner){
  return '<div class="card"><h3 style="font-size:14px;margin:0 0 8px;color:var(--navy);">'+esc(title)+'</h3>'+inner+'</div>';
}
function renderDashboard(){

  var totalPaid = students.reduce(function(a,s){return a+s.totalPaid;},0);
  var totalRemaining = students.reduce(function(a,s){return a+(s.courseFee-s.totalPaid);},0);
  var noCert = students.filter(function(s){return !s.certificateReceived;}).length;
  var avgAttendance = total ? students.reduce(function(a,s){return a+attendancePct(s.id);},0)/total : 0;
  var lowAttendance = students.filter(function(s){return attendancePct(s.id)<75;}).length;

  var byCourse = DATA.courses.map(function(c){ return {name:c.name, value:students.filter(function(s){return s.courseId===c.id;}).length}; }).filter(function(x){return x.value>0;});
  var regionMap = {};
  students.forEach(function(s){ regionMap[s.region] = (regionMap[s.region]||0)+1; });
  var byRegion = Object.keys(regionMap).map(function(k){ return {name:k, value:regionMap[k]}; });
  var attData = [
    {name:"حاضر", value:DATA.attendance.filter(function(a){return a.status==="حاضر";}).length},
    {name:"غائب", value:DATA.attendance.filter(function(a){return a.status==="غائب";}).length},
    {name:"اعتذار", value:DATA.attendance.filter(function(a){return a.status==="اعتذار";}).length}
  ];
  var certData = [
    {name:"استلموا الشهادة", value:students.filter(function(s){return s.certificateReceived;}).length},
    {name:"لم يستلموا", value:noCert}
  ];
  var payData = [{name:"المدفوعات", "مدفوع":totalPaid, "متبقي":totalRemaining}];

  var h = '<div style="display:flex;flex-direction:column;gap:20px;">';
  h += '<div class="grid grid-stats">';
  h += statCard("👥","إجمالي الطلاب",total);
  h += statCard("✅","الطلاب النشطون",active,"#2E7D53");
  h += statCard("🎓","أكملوا الكورس",completed,"#C9A24B");
  h += statCard("📘","إجمالي الكورسات",DATA.courses.length);
  h += statCard("👥","إجمالي المجموعات",DATA.groups.length);
  h += statCard("💰","إجمالي المدفوع",fmtMoney(totalPaid),"#2E7D53");
  h += statCard("💰","إجمالي المتبقي",fmtMoney(totalRemaining),"#A63A2E");
  h += statCard("🏆","بدون شهادة",noCert,"#B8862B");
  h += statCard("📅","متوسط نسبة الحضور",fmtPct(avgAttendance));
  h += statCard("⚠️","حضور أقل من 75%",lowAttendance,"#A63A2E");
  h += '</div>';

  h += '<div class="toolbar no-print">';
  h += '<button class="btn-gold" onclick="go(\'students\')">➕ تسجيل طالب جديد</button>';
  h += '<button class="btn-outline" onclick="go(\'attendance\')">📅 تسجيل حضور</button>';
  h += '<button class="btn-outline" onclick="go(\'payments\')">💰 تسجيل دفعة</button>';
  h += '<button class="btn-outline" onclick="go(\'reports\')">📈 إنشاء تقرير</button>';
  h += '</div>';

  h += '<div class="grid grid-2">';
  h += chartCard("توزيع الطلاب حسب الكورس", pieBlock(byCourse));
  h += chartCard("توزيع الطلاب حسب المنطقة", pieBlock(byRegion));
  h += chartCard("الحضور والغياب", barsBlock(attData, [{key:"value", color:"#C9A24B", label:"العدد"}]));
  h += chartCard("المدفوعات والمتبقي", barsBlock(payData, [{key:"مدفوع",color:"#2E7D53",label:"مدفوع"},{key:"متبقي",color:"#A63A2E",label:"متبقي"}], fmtMoney));
  h += chartCard("الشهادات المستلمة وغير المستلمة", pieBlock(certData));
  h += '</div></div>';
  return h;

function renderStudents(){
  var perms = getPerms();
  var f = UI.filters.students;
  var students = visibleStudents();
  var regions = students.map(function(s){return s.region;}).filter(function(v,i,a){return v && a.indexOf(v)===i;});

  var list = students.filter(function(s){
    var q = (f.q||"").trim();
    var matchQ = !q || s.name.indexOf(q)>=0 || s.phone.indexOf(q)>=0 || s.code.toLowerCase().indexOf(q.toLowerCase())>=0;
    var matchCourse = !f.course || s.courseId===f.course;
    var matchGroup = !f.group || s.groupId===f.group;
    var matchRegion = !f.region || s.region===f.region;
    var matchPay = !f.pay || paymentStatusOf(s.courseFee,s.totalPaid)===f.pay;
    var matchCert = !f.cert || (f.cert==="مستلمة" ? s.certificateReceived : !s.certificateReceived);
    var matchType = !f.type || s.studyType===f.type;
    return matchQ && matchCourse && matchGroup && matchRegion && matchPay && matchCert && matchType;
  });
  list = list.slice().sort(function(a,b){
    if(f.sort==="regDate-desc") return a.regDate<b.regDate?1:-1;
    if(f.sort==="regDate-asc") return a.regDate>b.regDate?1:-1;
    if(f.sort==="name-asc") return a.name.localeCompare(b.name,"ar");
    return 0;
  });
  var pageSize = 8;
  var totalPages = Math.max(1, Math.ceil(list.length/pageSize));
  if(f.page>totalPages) f.page = totalPages;
  var paged = list.slice((f.page-1)*pageSize, f.page*pageSize);

  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  h += '<div class="toolbar">';
  h += '<div style="flex:1;min-width:220px;max-width:340px;"><input id="stu-search" placeholder="بحث بالاسم أو الهاتف أو الكود" value="'+esc(f.q)+'" oninput="setFilter(\'students\',\'q\',this.value); setFilter(\'students\',\'page\',1);"></div>';
  h += '<div class="spacer"></div>';
  h += '<button class="btn-outline" onclick="exportStudentsCSV(CURRENT_STUDENT_LIST)">⬇️ تصدير CSV</button>';
  if(perms.canAddStudent) h += '<button class="btn-gold" onclick="openStudentModal(null)">➕ تسجيل طالب جديد</button>';
  h += '</div>';

  h += '<div class="filters">';
  h += '<select onchange="setFilter(\'students\',\'course\',this.value); setFilter(\'students\',\'group\',\'\'); setFilter(\'students\',\'page\',1);"><option value="">كل الكورسات</option>'+DATA.courses.map(function(c){return '<option value="'+c.id+'"'+(f.course===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join("")+'</select>';
  h += '<select onchange="setFilter(\'students\',\'group\',this.value); setFilter(\'students\',\'page\',1);"><option value="">كل المجموعات</option>'+DATA.groups.filter(function(g){return !f.course||g.courseId===f.course;}).map(function(g){return '<option value="'+g.id+'"'+(f.group===g.id?' selected':'')+'>'+esc(g.name)+'</option>';}).join("")+'</select>';
  h += '<select onchange="setFilter(\'students\',\'region\',this.value); setFilter(\'students\',\'page\',1);"><option value="">كل المناطق</option>'+regions.map(function(r){return '<option'+(f.region===r?' selected':'')+'>'+esc(r)+'</option>';}).join("")+'</select>';
  h += '<select onchange="setFilter(\'students\',\'pay\',this.value); setFilter(\'students\',\'page\',1);"><option value="">كل حالات الدفع</option>'+["لم يدفع","دفع جزئي","مكتمل الدفع"].map(function(p){return '<option'+(f.pay===p?' selected':'')+'>'+p+'</option>';}).join("")+'</select>';
  h += '<select onchange="setFilter(\'students\',\'cert\',this.value); setFilter(\'students\',\'page\',1);"><option value="">حالة الشهادة</option><option'+(f.cert==="مستلمة"?' selected':'')+'>مستلمة</option><option'+(f.cert==="غير مستلمة"?' selected':'')+'>غير مستلمة</option></select>';
  h += '<select onchange="setFilter(\'students\',\'type\',this.value); setFilter(\'students\',\'page\',1);"><option value="">نوع الدراسة</option>'+STUDY_TYPES.map(function(t){return '<option'+(f.type===t?' selected':'')+'>'+t+'</option>';}).join("")+'</select>';
  h += '<div style="margin-right:auto;"><select onchange="setFilter(\'students\',\'sort\',this.value)"><option value="regDate-desc"'+(f.sort==="regDate-desc"?' selected':'')+'>الأحدث تسجيلًا</option><option value="regDate-asc"'+(f.sort==="regDate-asc"?' selected':'')+'>الأقدم تسجيلًا</option><option value="name-asc"'+(f.sort==="name-asc"?' selected':'')+'>الاسم (أ-ي)</option></select></div>';
  h += '</div>';

  h += '<div class="table-wrap"><table><thead><tr>'+["كود الطالب","الاسم","الهاتف","المنطقة","الكورس","المجموعة","نوع الدراسة","تاريخ التسجيل","قيمة الكورس","دفع كام","عليه كام","حالة الدفع","الحضور","الشهادة","الحالة","إجراءات"].map(function(x){return '<th>'+x+'</th>';}).join("")+'</tr></thead><tbody>';
  paged.forEach(function(s){
    var remaining = s.courseFee - s.totalPaid;

    h += '<td>'+badge(s.certificateReceived?"مستلمة":"غير مستلمة")+'</td>';

    h += '<td><div class="actions-cell">';

    if(perms.canEditStudent) h += '<button class="icon-btn" title="تعديل" onclick="openStudentModal(\''+s.id+'\')">✏️</button>';
    if(perms.canDeleteStudent) h += '<button class="icon-btn" title="حذف" onclick="askConfirm(\'هل تريد حذف الطالب '+esc(s.name).replace(/'/g,"")+'؟\', function(){ deleteStudent(\''+s.id+'\'); })">🗑️</button>';
    h += '</div></td></tr>';
  });
  h += '</tbody></table>';
  if(!paged.length) h += '<div class="empty">لا يوجد طلاب مطابقين لهذا البحث</div>';
  if(totalPages>1){
    h += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;">';
    h += '<button class="btn-outline btn-sm" '+(f.page<=1?'disabled':'')+' onclick="setFilter(\'students\',\'page\','+(f.page-1)+')">السابق</button>';
    h += '<span style="font-size:12px;color:var(--muted);">صفحة '+f.page+' من '+totalPages+'</span>';

    h += '</div>';
  }
  h += '</div></div>';
  window.CURRENT_STUDENT_LIST = list;
  return h;
}

function studentModalOnCourseChange(courseId){
  UI.draft.courseId = courseId;
  UI.draft.groupId = "";
  var c = courseById(courseId);
  if(c) UI.draft.courseFee = c.fee;
  render();
}
function renderStudentModal(){
  var editingId = UI.modal.payload.editingId;
  var f = UI.draft;
  var groupOptions = DATA.groups.filter(function(g){return g.courseId===f.courseId;});
  var remaining = (Number(f.courseFee)||0) - (Number(f.totalPaid)||0);
  var m = '<div class="modal-overlay"><div class="modal-box wide"><div class="modal-head"><h3>'+(editingId?"تعديل بيانات الطالب":"تسجيل طالب جديد")+'</h3><button class="icon-btn" onclick="closeModal()">✖️</button></div>';
  m += '<div class="modal-body"><div class="field-grid">';
  m += '<div class="field"><label>كود الطالب</label><input disabled value="'+(editingId?esc(f.code):esc(nextStudentCode()))+'"></div>';
  m += '<div class="field"><label>الاسم بالكامل <span class="req">*</span></label><input id="f-name" value="'+esc(f.name)+'" oninput="setDraft(\'name\',this.value)" placeholder="اكتب الاسم بالكامل"></div>';
  m += '<div class="field"><label>رقم الهاتف <span class="req">*</span></label><input id="f-phone" value="'+esc(f.phone)+'" oninput="setDraft(\'phone\',this.value)"><span class="hint">مثال: 01012345678</span></div>';
  m += '<div class="field"><label>المنطقة / المحافظة</label><input id="f-region" value="'+esc(f.region)+'" oninput="setDraft(\'region\',this.value)"></div>';
  m += '<div class="field"><label>اسم الكورس <span class="req">*</span></label><select onchange="studentModalOnCourseChange(this.value)"><option value="">اختر الكورس</option>'+DATA.courses.map(function(c){return '<option value="'+c.id+'"'+(f.courseId===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join("")+'</select></div>';
  m += '<div class="field"><label>اسم المجموعة</label><select onchange="setDraft(\'groupId\',this.value)"><option value="">اختر المجموعة</option>'+groupOptions.map(function(g){return '<option value="'+g.id+'"'+(f.groupId===g.id?' selected':'')+'>'+esc(g.name)+'</option>';}).join("")+'</select></div>';
  m += '<div class="field"><label>نوع الدراسة</label><select onchange="setDraft(\'studyType\',this.value)">'+STUDY_TYPES.map(function(t){return '<option'+(f.studyType===t?' selected':'')+'>'+t+'</option>';}).join("")+'</select></div>';
  m += '<div class="field"><label>تاريخ التسجيل</label><input type="date" value="'+esc(f.regDate)+'" onchange="setDraft(\'regDate\',this.value)"></div>';
  m += '<div class="field"><label>قيمة الكورس</label><input id="f-fee" type="number" value="'+esc(f.courseFee)+'" oninput="setDraft(\'courseFee\',this.value)"></div>';
  m += '<div class="field"><label>المبلغ المدفوع</label><input id="f-paid" type="number" value="'+esc(f.totalPaid)+'" oninput="setDraft(\'totalPaid\',this.value)"></div>';
  m += '<div class="field"><label>المبلغ المتبقي</label><input disabled value="'+fmtMoney(Math.max(remaining,0))+'"></div>';
  m += '<div class="field"><label>حالة الطالب</label><select onchange="setDraft(\'studentStatus\',this.value)">'+STUDENT_STATUS.map(function(t){return '<option'+(f.studentStatus===t?' selected':'')+'>'+t+'</option>';}).join("")+'</select></div>';
  m += '</div>';
  m += '<div class="field"><label>ملاحظات</label><textarea id="f-notes" rows="3" oninput="setDraft(\'notes\',this.value)">'+esc(f.notes)+'</textarea></div>';
  m += '</div><div class="modal-foot"><button class="btn-outline" onclick="closeModal()">إلغاء</button><button class="btn-gold" onclick="saveStudentFromDraft('+(editingId?"'"+editingId+"'":"null")+')">💾 حفظ</button></div></div></div>';
  return m;
}

/* ============================== ملف الطالب ============================== */
function renderStudentProfile(){
  var student = DATA.students.filter(function(s){return s.id===UI.selectedStudentId;})[0];
  if(!student) return '<div class="empty">لم يتم العثور على الطالب</div>';
  var perms = getPerms();
  var recs = attendanceOf(student.id);
  var present = recs.filter(function(r){return r.status==="حاضر";}).length;
  var absent = recs.filter(function(r){return r.status==="غائب";}).length;
  var excused = recs.filter(function(r){return r.status==="اعتذار";}).length;
  var pct = attendancePct(student.id);
  var remaining = student.courseFee - student.totalPaid;
  var group = groupById(student.groupId);
  var course = courseById(student.courseId);
  var sessions = group ? group.sessions : [];
  var pays = paymentsOf(student.id);

  var h = '<div style="display:flex;flex-direction:column;gap:16px;">';
  h += '<div class="toolbar no-print" style="justify-content:space-between;">';
  h += '<button class="btn-ghost" onclick="go(\'students\')">‹ رجوع للطلاب</button>';
  h += '<div style="display:flex;gap:8px;"><button class="btn-outline" onclick="window.print()">🖨️ طباعة الملخص</button>';
  if(perms.canEditStudent) h += '<button class="btn-gold" onclick="openStudentModal(\''+student.id+'\')">✏️ تعديل البيانات</button>';
  h += '</div></div>';

  h += '<div class="hero"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">';
  h += '<div><h2 style="margin:0;font-size:20px;">'+esc(student.name)+'</h2><p style="margin:4px 0 0;font-size:13px;color:#C9D0E4;">كود الطالب: '+esc(student.code)+'</p></div>';
  h += '<div>'+badge(student.studentStatus)+' '+badge(paymentStatusOf(student.courseFee,student.totalPaid))+'</div></div>';
  h += '<div class="grid grid-stats" style="margin-top:14px;">';
  h += '<div style="font-size:13px;">📞 '+esc(student.phone)+'</div>';
  h += '<div style="font-size:13px;">📍 '+esc(student.region||"—")+'</div>';
  h += '<div style="font-size:13px;">📅 '+esc(student.regDate)+'</div>';
  h += '<div style="font-size:13px;">📘 '+esc(course?course.name:"")+' ('+esc(group?group.name:"—")+')</div>';
  h += '</div></div>';

  h += '<div class="grid grid-3">';
  h += '<div class="card"><h3 style="font-size:14px;margin:0 0 8px;color:var(--navy);">الملخص المالي</h3>';
  h += '<div class="row-kv"><span class="k">قيمة الكورس</span><span>'+fmtMoney(student.courseFee)+'</span></div>';
  h += '<div class="row-kv"><span class="k">إجمالي المدفوع</span><span>'+fmtMoney(student.totalPaid)+'</span></div>';
  h += '<div class="row-kv"><span class="k">المبلغ المتبقي</span><span style="font-weight:800;color:'+(remaining>0?"#A63A2E":"#2E7D53")+'">'+fmtMoney(remaining)+'</span></div>';
  if(perms.canEditPayments) h += '<button class="btn-gold btn-sm" style="width:100%;justify-content:center;margin-top:10px;" onclick="openPaymentModal(\''+student.id+'\')">➕ تسجيل دفعة</button>';
  h += '</div>';

  h += '<div class="card"><h3 style="font-size:14px;margin:0 0 8px;color:var(--navy);">الحضور</h3>';
  h += '<div class="row-kv"><span class="k">حضر</span><span>'+present+'</span></div>';
  h += '<div class="row-kv"><span class="k">غاب</span><span>'+absent+'</span></div>';
  h += '<div class="row-kv"><span class="k">اعتذار</span><span>'+excused+'</span></div>';
  h += '<div class="row-kv"><span class="k">نسبة الحضور</span><span style="font-weight:800;color:'+(pct<75?"#A63A2E":"#2E7D53")+'">'+fmtPct(pct)+'</span></div></div>';

  h += '<div class="card"><h3 style="font-size:14px;margin:0 0 8px;color:var(--navy);">الشهادة</h3>';
  if(perms.canEditCertificates){
    h += '<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;"><input type="checkbox" '+(student.certificateReceived?'checked':'')+' onchange="toggleCertificate(\''+student.id+'\')"> استلم الطالب الشهادة</label>';
    if(student.certificateReceived) h += '<div class="row-kv"><span class="k">تاريخ الاستلام</span><span>'+esc(student.certificateDate||"—")+'</span></div>';
  } else { h += badge(student.certificateReceived?"مستلمة":"غير مستلمة"); }
  h += '</div></div>';

  h += '<div class="card" style="overflow-x:auto;"><h3 style="font-size:14px;margin:0 0 10px;color:var(--navy);">جدول الحضور لكل سيشن</h3><table><thead><tr>'+sessions.map(function(s){return '<th>'+esc(s.title)+'</th>';}).join("")+'</tr></thead><tbody><tr>';
  sessions.forEach(function(s){
    var r = recs.filter(function(x){return x.sessionIndex===s.index;})[0];
    h += '<td>'+(r?badge(r.status):'<span style="color:var(--muted);">—</span>')+'</td>';
  });
  h += '</tr></tbody></table></div>';

  h += '<div class="card" style="overflow-x:auto;"><h3 style="font-size:14px;margin:0 0 10px;color:var(--navy);">سجل المدفوعات</h3><table><thead><tr><th>تاريخ الدفع</th><th>المبلغ</th><th>طريقة الدفع</th><th>ملاحظات</th></tr></thead><tbody>';
  pays.forEach(function(p){ h += '<tr class="row-line"><td>'+esc(p.date)+'</td><td>'+fmtMoney(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.notes||"—")+'</td></tr>'; });
  h += '</tbody></table>';
  if(!pays.length) h += '<div class="empty">لا توجد مدفوعات مسجلة</div>';
  h += '</div></div>';
  return h;
}

/* ============================== الحضور والغياب ============================== */
function renderAttendance(){
  var perms = getPerms();
  var teacherGroupIds = getTeacherGroupIds();
  var availableGroups = UI.role==="مدرس" ? DATA.groups.filter(function(g){return teacherGroupIds.indexOf(g.id)>=0;}) : DATA.groups;
  var f = UI.filters.attendance;
  if(!f.course && DATA.courses[0]) f.course = DATA.courses[0].id;
  var groupsForCourse = availableGroups.filter(function(g){return !f.course || g.courseId===f.course;});
  function studentsInGroup(gid){ return DATA.students.filter(function(s){return s.groupId===gid;}).length; }
  if(!f.group || groupsForCourse.every(function(g){return g.id!==f.group;})){
    var firstWithStudents = groupsForCourse.filter(function(g){return studentsInGroup(g.id)>0;})[0];
    f.group = firstWithStudents ? firstWithStudents.id : (groupsForCourse[0] ? groupsForCourse[0].id : "");
  }
  var group = groupById(f.group);
  if(!group) return '<div class="empty">لا توجد مجموعات لهذا الكورس بعد — أضف مجموعة من صفحة "الكورسات والمجموعات"</div>';
  var groupStudents = DATA.students.filter(function(s){return s.groupId===group.id;});
  var sessionIndex = f.session || 1;
  if(sessionIndex > group.sessions.length){ sessionIndex = 1; f.session = 1; }
  var session = group.sessions.filter(function(s){return s.index===sessionIndex;})[0];

  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  h += '<div class="filters">';
  h += '<select onchange="setFilter(\'attendance\',\'course\',this.value); setFilter(\'attendance\',\'group\',\'\'); setFilter(\'attendance\',\'session\',1);">'+DATA.courses.map(function(c){return '<option value="'+c.id+'"'+(f.course===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join("")+'</select>';
  h += '<select onchange="setFilter(\'attendance\',\'group\',this.value); setFilter(\'attendance\',\'session\',1);">'+groupsForCourse.map(function(g){return '<option value="'+g.id+'"'+(f.group===g.id?' selected':'')+'>'+esc(g.name)+' ('+studentsInGroup(g.id)+' طالب)</option>';}).join("")+'</select>';
  h += '</div>';

  h += '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">';
  group.sessions.forEach(function(s){
    h += '<button class="chip-btn'+(sessionIndex===s.index?' active':'')+'" style="min-width:90px;" onclick="setFilter(\'attendance\',\'session\','+s.index+')">'+esc(s.title)+'<br><span style="font-weight:400;opacity:.75;">'+esc(s.date)+'</span></button>';
  });
  h += '</div>';

  h += '<div class="card"><div class="field-grid">';
  h += '<div class="field"><label>تاريخ السيشن</label><input type="date" '+(perms.canEditAttendance?'':'disabled')+' value="'+esc(session?session.date:"")+'" onchange="setSessionField(\''+group.id+'\','+sessionIndex+',\'date\',this.value)"></div>';
  h += '<div class="field"><label>عنوان السيشن</label><input '+(perms.canEditAttendance?'':'disabled')+' value="'+esc(session?session.title:"")+'" onchange="setSessionField(\''+group.id+'\','+sessionIndex+',\'title\',this.value)"></div>';
  h += '</div></div>';

  if(perms.canEditAttendance){
    h += '<div class="toolbar no-print">';
    h += '<button class="btn-outline btn-sm" onclick="markAllAttendance(\''+group.id+'\','+sessionIndex+',\'حاضر\')">✔️ تحديد الكل حاضر</button>';
    h += '<button class="btn-outline btn-sm" onclick="markAllAttendance(\''+group.id+'\','+sessionIndex+',\'غائب\')">✖️ تحديد الكل غائب</button>';
    h += '</div>';
  }

  h += '<div class="table-wrap"><table><thead><tr><th>كود الطالب</th><th>اسم الطالب</th><th>حالة الحضور</th><th>إجمالي الحضور</th><th>نسبة الحضور</th></tr></thead><tbody>';
  groupStudents.forEach(function(s){
    var recs = DATA.attendance.filter(function(a){return a.studentId===s.id;});
    var rec = recs.filter(function(a){return a.sessionIndex===sessionIndex;})[0];
    var presentCount = recs.filter(function(a){return a.status==="حاضر";}).length;
    h += '<tr class="row-line"><td style="font-family:monospace">'+esc(s.code)+'</td><td style="font-weight:700;">'+esc(s.name)+'</td><td><div style="display:flex;gap:6px;">';
    ATTEND_STATUS.forEach(function(st){
      var cls = st==="حاضر"?"active-present":(st==="غائب"?"active-absent":"active-excused");
      var isActive = rec && rec.status===st;
      h += '<button class="att-status-btn'+(isActive?(' '+cls):'')+'" '+(perms.canEditAttendance?'':'disabled')+' onclick="upsertAttendance(\''+s.id+'\',\''+group.id+'\','+sessionIndex+',\''+st+'\')">'+st+'</button>';
    });
    var groupSessionsN = group.sessions.length;
    h += '</div></td><td>'+presentCount+' / '+groupSessionsN+'</td><td>'+fmtPct((presentCount/groupSessionsN)*100)+'</td></tr>';
  });
  h += '</tbody></table>';
  if(!groupStudents.length) h += '<div class="empty">لا يوجد طلاب مسجلين في هذه المجموعة.<br>سجّل طالب من صفحة "الطلاب" واختار الكورس ثم هذه المجموعة، أو عدّل بيانات طالب موجود واختار له المجموعة.</div>';
  h += '</div>';
  h += '<p style="font-size:11px;color:var(--muted);">* يتم حفظ حالة الحضور فوريًا عند الضغط على أي حالة، ولا يمكن تسجيل أكثر من حالة لنفس الطالب في نفس السيشن.</p>';
  h += '</div>';
  return h;
}

/* ============================== المدفوعات ============================== */
function renderPayments(){
  var perms = getPerms();
  var f = UI.filters.payments;
  var studentById = {}; DATA.students.forEach(function(s){ studentById[s.id]=s; });
  var list = DATA.payments.filter(function(p){
    var q = (f.q||"").trim();
    if(!q) return true;
    var st = studentById[p.studentId];
    return (st && st.name.indexOf(q)>=0) || p.paymentNo.indexOf(q)>=0;
  }).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var totalPaid = DATA.payments.reduce(function(a,p){return a+p.amount;},0);

  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  h += '<div class="grid grid-3">';
  h += statCard("💰","إجمالي المدفوعات",fmtMoney(totalPaid),"#2E7D53");
  h += statCard("📈","عدد المعاملات",DATA.payments.length);
  h += statCard("⚠️","طلاب لم يستكملوا الدفع",DATA.students.filter(function(s){return s.totalPaid<s.courseFee;}).length,"#B8862B");
  h += '</div>';
  h += '<div class="toolbar">';
  h += '<div style="max-width:320px;flex:1;"><input placeholder="بحث برقم الدفعة أو اسم الطالب" value="'+esc(f.q)+'" oninput="setFilter(\'payments\',\'q\',this.value)"></div>';
  h += '<div class="spacer"></div>';
  if(perms.canEditPayments) h += '<button class="btn-gold" onclick="openPaymentModal(null)">➕ تسجيل دفعة جديدة</button>';
  h += '</div>';
  h += '<div class="table-wrap"><table><thead><tr><th>رقم الدفعة</th><th>كود الطالب</th><th>اسم الطالب</th><th>تاريخ الدفع</th><th>المبلغ</th><th>طريقة الدفع</th><th>ملاحظات</th></tr></thead><tbody>';
  list.forEach(function(p){
    var st = studentById[p.studentId];
    h += '<tr class="row-line"><td style="font-family:monospace">'+esc(p.paymentNo)+'</td><td style="font-family:monospace">'+esc(st?st.code:"")+'</td>';
    h += '<td style="font-weight:700;color:var(--navy);cursor:pointer;" onclick="goToStudent(\''+p.studentId+'\')">'+esc(st?st.name:"—")+'</td>';
    h += '<td>'+esc(p.date)+'</td><td>'+fmtMoney(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.notes||"—")+'</td></tr>';
  });
  h += '</tbody></table>';
  if(!list.length) h += '<div class="empty">لا توجد مدفوعات</div>';
  h += '</div></div>';
  return h;
}

/* ============================== الكورسات والمجموعات ============================== */
function renderCourses(){
  var perms = getPerms();
  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  if(perms.canManageCourses) h += '<div style="display:flex;justify-content:flex-end;"><button class="btn-gold" onclick="openCourseModal(null)">➕ إضافة كورس جديد</button></div>';
  h += '<div class="grid grid-2">';
  DATA.courses.forEach(function(c){
    var courseGroups = DATA.groups.filter(function(g){return g.courseId===c.id;});
    var countStudents = DATA.students.filter(function(s){return s.courseId===c.id;}).length;
    h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;">';
    h += '<div><h3 style="margin:0;font-size:15px;color:var(--navy);">'+esc(c.name)+'</h3><p style="margin:2px 0 0;font-size:11px;color:var(--muted);">'+esc(c.code)+' · '+esc(c.description||"")+'</p></div>';
    h += badge(c.status) + '</div>';
    h += '<div class="grid grid-2" style="margin-top:10px;">';
    h += '<div class="row-kv"><span class="k">القيمة</span><span>'+fmtMoney(c.fee)+'</span></div>';
    h += '<div class="row-kv"><span class="k">نوع الدراسة</span><span>'+esc(c.studyType)+'</span></div>';
    h += '<div class="row-kv"><span class="k">عدد المجموعات</span><span>'+courseGroups.length+'</span></div>';
    h += '<div class="row-kv"><span class="k">عدد الطلاب</span><span>'+countStudents+'</span></div>';
    h += '</div>';
    if(perms.canManageCourses){
      h += '<div style="display:flex;gap:6px;margin-top:10px;">';
      h += '<button class="btn-outline btn-sm" onclick="openCourseModal(\''+c.id+'\')">✏️ تعديل</button>';
      h += '<button class="btn-outline btn-sm" onclick="openGroupModal(\''+c.id+'\',null)">➕ إضافة مجموعة</button>';
      h += '<button class="btn-danger btn-sm" onclick="askConfirm(\'حذف الكورس '+esc(c.name).replace(/'/g,"")+'؟\', function(){ deleteCourse(\''+c.id+'\'); })">🗑️ حذف</button>';
      h += '</div>';
    }
    h += '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">';
    courseGroups.forEach(function(g){

/* ============================== الشهادات ============================== */
function renderCertificates(){
  var perms = getPerms();
  var students = DATA.students;
  var received = students.filter(function(s){return s.certificateReceived;});
  var notReceived = students.filter(function(s){return !s.certificateReceived;});
  var pending = students.filter(function(s){return s.studentStatus==="مكتمل" && !s.certificateReceived;});
  var tab = UI.filters.certificates.tab;
  var list = tab==="received"?received: tab==="not"?notReceived: tab==="pending"?pending: students;

  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  h += '<div class="grid grid-3">';
  h += statCard("🏆","استلموا الشهادة",received.length,"#2E7D53");
  h += statCard("❌","لم يستلموا",notReceived.length,"#A63A2E");
  h += statCard("⚠️","أكملوا الكورس ولم يستلموا",pending.length,"#B8862B");
  h += '</div>';
  h += '<div class="toolbar no-print">';
  [["all","الكل"],["received","استلموا الشهادة"],["not","لم يستلموا"],["pending","أكملوا ولم يستلموا"]].forEach(function(t){
    h += '<button class="pill'+(tab===t[0]?' active':'')+'" onclick="setFilter(\'certificates\',\'tab\',\''+t[0]+'\')">'+t[1]+'</button>';
  });
  h += '</div>';
  h += '<div class="table-wrap"><table><thead><tr><th>كود الطالب</th><th>اسم الطالب</th><th>الكورس</th><th>نسبة الحضور</th><th>حالة الطالب</th><th>تاريخ الاستلام</th><th>الشهادة</th></tr></thead><tbody>';
  list.forEach(function(s){
    var c = courseById(s.courseId);
    h += '<tr class="row-line"><td style="font-family:monospace">'+esc(s.code)+'</td>';
    h += '<td style="font-weight:700;color:var(--navy);cursor:pointer;" onclick="goToStudent(\''+s.id+'\')">'+esc(s.name)+'</td>';
    h += '<td>'+esc(c?c.name:"")+'</td><td>'+fmtPct(attendancePct(s.id))+'</td><td>'+badge(s.studentStatus)+'</td><td>'+esc(s.certificateDate||"—")+'</td>';
    h += '<td><button '+(perms.canEditCertificates?'':'disabled') +' style="background:transparent;border:none;padding:0;" onclick="toggleCertificate(\''+s.id+'\')">'+badge(s.certificateReceived?"مستلمة":"غير مستلمة")+'</button></td></tr>';
  });
  h += '</tbody></table>';
  if(!list.length) h += '<div class="empty">لا توجد بيانات</div>';
  h += '</div></div>';
  return h;
}

var REPORT_TYPES = ["جميع الطلاب","الطلاب حسب الكورس","الطلاب حسب المنطقة","تقرير الحضور","حضور أقل من 75%","تقرير المدفوعات","المتبقي على الطلاب","الشهادات المستلمة","الشهادات غير المستلمة","الطلاب الذين أكملوا الكورس"];
function renderReports(){
  var f = UI.filters.reports;
  var rows = DATA.students;
  if(f.course) rows = rows.filter(function(s){return s.courseId===f.course;});
  if(f.type==="حضور أقل من 75%") rows = rows.filter(function(s){return attendancePct(s.id)<75;});
  if(f.type==="المتبقي على الطلاب") rows = rows.filter(function(s){return s.courseFee-s.totalPaid>0;});
  if(f.type==="الشهادات المستلمة") rows = rows.filter(function(s){return s.certificateReceived;});
  if(f.type==="الشهادات غير المستلمة") rows = rows.filter(function(s){return !s.certificateReceived;});
  if(f.type==="الطلاب الذين أكملوا الكورس") rows = rows.filter(function(s){return s.studentStatus==="مكتمل";});
  var isPay = f.type==="تقرير المدفوعات";
  var isAtt = f.type==="تقرير الحضور";

  var h = '<div style="display:flex;flex-direction:column;gap:14px;">';
  h += '<div class="filters no-print">';
  h += '<select style="min-width:220px" onchange="setFilter(\'reports\',\'type\',this.value)">'+REPORT_TYPES.map(function(t){return '<option'+(f.type===t?' selected':'')+'>'+t+'</option>';}).join("")+'</select>';
  if(f.type==="الطلاب حسب الكورس"){
    h += '<select onchange="setFilter(\'reports\',\'course\',this.value)"><option value="">كل الكورسات</option>'+DATA.courses.map(function(c){return '<option value="'+c.id+'"'+(f.course===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join("")+'</select>';
  }
  h += '<div class="spacer"></div>';
  h += '<button class="btn-outline" onclick="window.print()">🖨️ طباعة</button>';
  h += '<button class="btn-gold" onclick="exportStudentsCSV(CURRENT_REPORT_ROWS)">⬇️ تصدير CSV</button>';
  h += '</div>';

  h += '<div class="table-wrap">';
  if(isPay){
    h += '<table><thead><tr><th>رقم الدفعة</th><th>الطالب</th><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th></tr></thead><tbody>';
    DATA.payments.forEach(function(p){
      var st = DATA.students.filter(function(s){return s.id===p.studentId;})[0];
      h += '<tr class="row-line"><td>'+esc(p.paymentNo)+'</td><td>'+esc(st?st.name:"")+'</td><td>'+esc(p.date)+'</td><td>'+fmtMoney(p.amount)+'</td><td>'+esc(p.method)+'</td></tr>';
    });
    h += '</tbody></table>';
  } else if(isAtt){
    h += '<table><thead><tr><th>الطالب</th><th>الكورس</th><th>نسبة الحضور</th></tr></thead><tbody>';
    rows.forEach(function(s){ var c=courseById(s.courseId); h += '<tr class="row-line"><td>'+esc(s.name)+'</td><td>'+esc(c?c.name:"")+'</td><td>'+fmtPct(attendancePct(s.id))+'</td></tr>'; });
    h += '</tbody></table>';
  } else {
    h += '<table><thead><tr><th>كود الطالب</th><th>الاسم</th><th>الكورس</th><th>المجموعة</th><th>المنطقة</th><th>المتبقي</th><th>نسبة الحضور</th><th>الشهادة</th></tr></thead><tbody>';
    rows.forEach(function(s){
      var c = courseById(s.courseId), g = groupById(s.groupId);
      h += '<tr class="row-line"><td style="font-family:monospace">'+esc(s.code)+'</td><td style="font-weight:700;">'+esc(s.name)+'</td><td>'+esc(c?c.name:"")+'</td>';
      h += '<td>'+esc(g?g.name:"")+'</td><td>'+esc(s.region)+'</td><td>'+fmtMoney(s.courseFee-s.totalPaid)+'</td><td>'+fmtPct(attendancePct(s.id))+'</td><td>'+badge(s.certificateReceived?"مستلمة":"غير مستلمة")+'</td></tr>';
    });
    h += '</tbody></table>';
  }
  if(!rows.length && !isPay) h += '<div class="empty">لا توجد بيانات لهذا التقرير</div>';
  h += '</div></div>';
  window.CURRENT_REPORT_ROWS = rows;
  return h;
}

  dbUpdateSettings({brandName:value}).catch(function(e){ toast("فشل حفظ اسم البراند: "+dbErrText(e), "err"); });
}

/* ============================== المودالات ============================== */
function renderModal(){
  switch(UI.modal.type){
    case "student": return renderStudentModal();
    case "payment": return renderPaymentModal();
    case "course": return renderCourseModal();
    case "group": return renderGroupModal();
    case "user": return renderUserModal();
    default: return "";
  }
}

/* ============================== بدء التشغيل ============================== */
render();
(async function boot(){
  try{
    var res = await sb.auth.getSession();
    SESSION = res.data.session;
  }catch(e){ SESSION = null; }
  if(SESSION){ await loadData(); applyMyRole(); }
  else render();
})();
sb.auth.onAuthStateChange(function(event, session){
  if(event === "SIGNED_OUT"){ SESSION = null; DATA = null; render(); }
});
</script>
